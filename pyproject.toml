[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkai"
version = "0.9.0"
description = "ZKAI — Production-Grade Native AI Operating System & Unified Intelligence Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ZK"}
]
keywords = [
    "ai", "ai-operating-system", "hypervisor", "microkernel",
    "deep-learning", "transformer", "neural-network",
    "agent", "computer-vision", "nlp", "llm", "foundation-model", "autonomous"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Operating System Kernels",
]

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
vision = [
    "pillow>=10.2.0",
    "opencv-python>=4.9.0",
    "easyocr>=1.7.0",
]
nlp = [
    "tokenizers>=0.15.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.3.0",
]
vector = [
    "faiss-cpu>=1.7.4",
]
audio = [
    "openai-whisper>=20231117",
]
automation = [
    "playwright>=1.41.0",
    "pyside6>=6.6.0",
]
server = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
all = [
    "pillow>=10.2.0",
    "opencv-python>=4.9.0",
    "easyocr>=1.7.0",
    "tokenizers>=0.15.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "openai-whisper>=20231117",
    "playwright>=1.41.0",
    "pyside6>=6.6.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zkai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 100
